[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "untitled-jam-backend"
version = "0.1.0"
description = "FastAPI and Pydantic backend for Untitled Jam"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anyio>=4.10.0,<5.0.0",
  "fastapi>=0.116.1,<1.0.0",
  "pillow==12.1.0",
  "pydantic>=2.11.7,<3.0.0",
  "rembg[cpu]==2.0.84",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.scripts]
untitled-jam-preload-background-model = "untitled_jam.preload_model:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.4.1,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["server/src"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
markers = [
  "real_model: opt-in smoke tests that load the real BiRefNet model",
]
